<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VALORAIPLUS® Sovereign Audit Matrix v55.0.1</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; border: 1px solid #00ff41; padding: 20px; box-shadow: 0 0 15px #00ff41; }
        h1 { text-align: center; text-transform: uppercase; border-bottom: 1px dashed #00ff41; padding-bottom: 10px; }
        .stat-box { display: flex; justify-content: space-between; margin: 20px 0; border: 1px solid #333; padding: 10px; }
        .stat-label { font-weight: bold; color: #fff; }
        .hash { word-break: break-all; color: #00ccff; }
        .status { text-align: center; font-size: 1.5em; color: #ff00ff; margin-top: 30px; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>VALORAIPLUS® Audit Terminal v55.0.1</h1>

        <div class="stat-box">
            <span class="stat-label">AUTHORITY NODE:</span>
            <span>SAINT PAUL / SAN FRANCISCO HUB</span>
        </div>

        <div class="stat-box">
            <span class="stat-label">VALUATION (VERIFIED):</span>
            <span style="color: #ffd700;">$16,890,000,000.00 USD</span>
        </div>

        <div class="stat-box" style="flex-direction: column;">
            <span class="stat-label">REALITY ANCHOR (SHA-256):</span>
            <span class="hash" id="anchor">LOADING...</span>
        </div>

        <div class="stat-box" style="flex-direction: column;">
            <span class="stat-label">MERKLE ROOT (KECCAK-256):</span>
            <span class="hash" id="root">LOADING...</span>
        </div>

        <div class="stat-box" style="flex-direction: column;">
            <span class="stat-label">HANDSHAKE PROOF (INDEX 1):</span>
            <pre id="proof" style="color: #aaa; white-space: pre-wrap;">LOADING...</pre>
        </div>

        <div class="status" id="status">INITIALIZING...</div>
    </div>

    <script>
        async function loadMatrix() {
            try {
                const response = await fetch('handshake_artifact.json');
                const data = await response.json();

                document.getElementById('anchor').innerText = data.anchor_reality_sha256;
                document.getElementById('root').innerText = data.merkle_root_keccak;
                document.getElementById('proof').innerText = JSON.stringify(data.handshake, null, 2);
                document.getElementById('status').innerText = data.status;
            } catch (e) {
                document.getElementById('status').innerText = "CONNECTION FAILED: ARTIFACT MISSING";
                document.getElementById('status').style.color = "red";
            }
        }
        loadMatrix();
    </script>
</body>
</html>
